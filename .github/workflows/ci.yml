name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-gate:
    name: Complete committed-source gate
    runs-on: ubuntu-24.04
    # The complete gate intentionally runs 21 bounded proofs and 30 generic
    # synthesis tops after both simulator matrices. Ubuntu-hosted runner timing
    # measurements put the normal sequential runtime above one hour, so retain
    # deterministic serial execution with explicit headroom for runner variance.
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-toolchain.txt

      - name: Install open-source HDL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends iverilog verilator
          python -m pip install --requirement requirements-toolchain.txt

      - name: Report tool versions
        run: |
          python3 --version
          verilator --version
          iverilog -V
          yowasp-yosys -V

      # The gate verifies reference metadata and digests, but deliberately does
      # not download or redistribute the copyrighted manufacturer manuals.
      - name: Run authoritative gate
        run: make ci
